name: ci

# Why this file exists (AUDIT.md F16): the two worst bugs pc-eye ever shipped — the DPI coordinate
# split and the truncated clipboard HANDLE — were both, in the README's own words, "invisible from Linux
# and obvious within minutes on the real machine". A windows-latest runner executes ctypes.windll,
# ImageGrab, GetSystemMetrics and the clipboard for real, headless, with no tunnel, no token and
# --dry-run, so nothing can ever move a pointer from CI. That is the cheapest possible insurance for a
# tool whose whole failure mode is "looks like it worked".
#
# Note on shape: keep every inline command in a block scalar. An earlier revision of this file put a
# `python -c "...assert x: y"` on one line and GitHub failed the whole workflow at PARSE time with no
# job, no log and no annotation — a red X on the commit and nothing to read. Scripts go in tools/.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the one runtime dependency
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow

      - name: Suite + measurement harnesses
        run: |
          python tests/run_all.py --all
        env:
          PYTHONWARNINGS: error::ResourceWarning

      - name: Docs must not drift from the code
        run: |
          python tools/check_docs.py

      - name: Ship gate commands, verbatim
        run: |
          python -c "import server,launcher;print('imports ok', server.VERSION)"
          python server.py --version
          python launcher.py --help

      # No --port here: --selftest asks a question about the machine and must never need a socket. The
      # capture/platform rows WILL go red on the headless runner image (no desktop session), and that is
      # the honest answer — so continue-on-error, but the step's output is kept and read by a human.
      - name: Selftest on this box (a red capture row on a headless runner is expected, not a fake green)
        continue-on-error: true
        run: |
          python server.py --selftest --dry-run
