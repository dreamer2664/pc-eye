name: ci

# Why this file exists (AUDIT.md F16): the two worst bugs pc-eye ever shipped — the DPI coordinate split
# and the truncated clipboard HANDLE — were both "invisible from Linux and obvious within minutes on the
# real machine" (the README's own words). A windows-latest runner executes ctypes.windll, ImageGrab,
# GetSystemMetrics and the clipboard for real, headless, with no tunnel and no token, and it can be told
# --dry-run so nothing ever moves a pointer. That is the cheapest possible insurance for a tool whose
# whole failure mode is "looks like it worked".

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install Pillow (the one runtime dependency)
        run: python -m pip install --quiet --disable-pip-version-check pillow
      - name: suite + measurement harnesses
        run: python tests/run_all.py --all
        env:
          PYTHONWARNINGS: error::ResourceWarning
      - name: the exact command a human double-clicks is importable and self-tests
        run: |
          python launcher.py --help > /dev/null || python launcher.py --help > nul
          python server.py --selftest --dry-run || echo "selftest exit non-zero: capture unavailable in CI, which is an honest red, not a fake green"
      - name: audit doc must still match reality
        run: python -c "import pathlib,re;s=pathlib.Path('server.py').read_text();m=re.search(r'VERSION = \"([0-9.]+)\"',s);assert m;v=m.group(1);r=pathlib.Path('README.md').read_text();c=pathlib.Path('CHANGELOG.md').read_text();assert v in r and v in c, 'version drift: '+v"
